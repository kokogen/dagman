version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: dagman_postgres
    environment:
      POSTGRES_USER: dagman
      POSTGRES_PASSWORD: dagman
      POSTGRES_DB: dagman
    ports:
      - "5432:5432"
    volumes:
      - /Users/koko/devzone/data/pg/data:/var/lib/postgresql/data
      - /Users/koko/devzone/data/pg/config:/etc/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagman"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dagman_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://dagman:dagman@postgres:5432/dagman?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped 